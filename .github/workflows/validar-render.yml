name: Validar deploy do Baby Yoda

on:
  push:
    branches:
      - preparar-render
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar sintaxe Python
        run: python -m compileall -q main.py ingest.py

      - name: Validar configuracao do Render
        run: |
          python - <<'PY'
          import yaml

          with open("render.yaml", encoding="utf-8") as file:
              config = yaml.safe_load(file)

          assert isinstance(config, dict), "render.yaml precisa conter um objeto YAML"
          services = config.get("services", [])
          assert services, "Nenhum servico foi definido em render.yaml"
          service = services[0]
          assert service.get("type") == "web", "O servico precisa ser do tipo web"
          assert service.get("healthCheckPath") == "/healthz", "Health check incorreto"
          assert "gunicorn main:app" in service.get("startCommand", ""), "Comando de inicializacao incorreto"

          env = {item["key"]: item for item in service.get("envVars", [])}
          assert "GEMINI_API_KEY" in env, "GEMINI_API_KEY ausente"
          assert "SITE_PASSWORD" in env, "SITE_PASSWORD ausente"
          models = env.get("GEMINI_MODELS", {}).get("value", "")
          assert len([model for model in models.split(",") if model.strip()]) >= 2, "Fallback de modelos nao configurado"
          print("render.yaml valido; modelos de fallback configurados.")
          PY

      - name: Importar aplicacao Flask
        run: python -c "import main; assert main.app is not None; print('Aplicacao Flask importada com sucesso.')"
