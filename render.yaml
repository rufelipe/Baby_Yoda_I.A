services:
  - type: web
    name: baby-yoda-ia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
